apiVersion: v1
kind: Secret
metadata:
  name: app-secret
data:
  DB_HOST: bx1zcWw==
  DB_USER: cm9xvW==
  DB_PASSWD: cGFzd3Jk

# Using config in a manifest files  
apiVersion: v1
kind: Pod 
metadata:
  name: simple-webapp-color 
spec:
  containers:
  - name: simple-webapp-color
    image: simple-webapp-color
    ports:
    - containerPort: 8080
    envFrom:
      - secretRef:
          name: app-secret

# to pass multiple env variables use the below 
    envFrom:
      - secretRef:
          name: app-secret

# To pass sigle env variable use the below.
    env:
    - name: DB_PASSWD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWD

# To pass the env variable as a volume
volumes:
- name: app-secret-volume
  secret:
    secretName: app-secret

